name: Update app sources

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "config/ios/**"
      - "config/android/**"
      - "config/library/**"
      - "scripts/*.py"
      - ".github/workflows/update-source.yml"

permissions:
  contents: write

concurrency:
  group: update-app-sources
  cancel-in-progress: false

jobs:
  update:
    name: Generate catalogs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install icon conversion dependency
        run: python -m pip install --disable-pip-version-check "pillow>=10,<13"
      - name: Generate iOS catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCELERATOR_BASE_URL: ${{ vars.ACCELERATOR_BASE_URL }}
        run: python scripts/generate_ios.py
      - name: Generate Android catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCELERATOR_BASE_URL: ${{ vars.ACCELERATOR_BASE_URL }}
        run: python scripts/generate_android.py
      - name: Generate subscription source feeds
        run: python scripts/generate_library.py
      - name: Commit catalog changes
        # GitHub ignores the `paths` filter for tag pushes, so a release tag runs
        # this job on a detached HEAD where `git push` has no branch to push to.
        if: github.ref_type == 'branch'
        run: |
          if git diff --quiet -- apps.json android.json config/ios/sources config/android/sources config/android/catalog.json sources; then
            echo "Catalogs are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json android.json config/ios/sources config/android/sources config/android/catalog.json sources
          git commit -m "chore: update app catalogs"
          git push
