<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="管理个人应用源中的手动条目。" />
    <title>自有应用源 · 应用管理</title>
    <link rel="stylesheet" href="/styles.css?v=20261013-tab-memory" />
    <script src="/copy-catalog-url.js?v=20261013-tab-memory" defer></script>
    <script src="/confirm-dialog.js?v=20261013-tab-memory" defer></script>
    <script src="/view-preference.js?v=20261013-tab-memory" defer></script>
    <script src="/app.js?v=20261013-tab-memory" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="topbar">
      <a class="brand" href="/" aria-label="自有应用源首页">
        <span class="brand-mark" aria-hidden="true">APP</span>
        <span>自有应用源</span>
      </a>
      <nav class="topbar-nav" aria-label="主导航">
        <a class="nav-link active" href="/">应用管理</a>
        <a class="nav-link" href="/catalog">完整目录</a>
      </nav>
      <div class="topbar-meta"><span class="status-dot"></span>私有管理</div>
    </header>

    <main id="main" class="workspace">
      <section class="page-heading" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">SOURCE / CUSTOM</p>
          <h1 id="page-title">应用管理</h1>
          <p class="lede">手动添加的应用会保存到仓库，并自动合并进对应的平台源。</p>
        </div>
        <div class="heading-actions">
          <button class="copy-url-button" type="button" data-copy-catalog-url aria-label="复制当前平台目录地址" title="复制当前平台目录地址">
            <svg aria-hidden="true" viewBox="0 0 16 16"><rect x="5" y="5" width="8" height="9" rx="1.5"></rect><path d="M10.5 5V3.5A1.5 1.5 0 0 0 9 2H4.5A1.5 1.5 0 0 0 3 3.5v7A1.5 1.5 0 0 0 4.5 12H5"></path></svg>
            <span data-copy-label>复制 apps.json</span>
          </button>
          <span class="copy-url-status" data-copy-status role="status" aria-live="polite"></span>
          <div class="catalog-count" aria-live="polite">
            <span id="app-count" class="count-number">—</span>
            <span class="count-label">已登记</span>
          </div>
        </div>
      </section>

      <div class="platform-switch" role="tablist" aria-label="选择平台">
        <button class="platform-tab active" type="button" role="tab" aria-selected="true" data-platform="ios">
          <span class="platform-glyph" aria-hidden="true">iOS</span>
          <span class="platform-name">iOS / tvOS</span>
          <span class="platform-note">IPA</span>
        </button>
        <button class="platform-tab" type="button" role="tab" aria-selected="false" data-platform="android">
          <span class="platform-glyph" aria-hidden="true">APK</span>
          <span class="platform-name">Android</span>
          <span class="platform-note">APK</span>
        </button>
      </div>

      <section class="entry-layout" aria-label="添加应用和已登记应用">
        <form id="app-form" class="form-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">NEW ENTRY</p>
              <h2 id="form-title">添加 iOS 应用</h2>
            </div>
            <span class="step-mark">01</span>
          </div>

          <label class="field" for="app-name">
            <span>应用名称 <span class="required">*</span></span>
            <input id="app-name" name="name" autocomplete="off" placeholder="例如：我的播放器" required maxlength="120" />
          </label>

          <label class="field" for="ipa-url">
            <span id="url-field-label">IPA 下载地址 <span class="required">*</span></span>
            <input id="ipa-url" name="downloadURL" type="url" inputmode="url" placeholder="https://…/app.ipa" required />
            <small id="url-field-hint">需为可直接下载的 HTTPS 链接。提交后由 GitHub Actions 下载 IPA 并读取 Bundle ID、版本与图标。</small>
            <small id="url-field-error" class="field-error" role="alert" hidden></small>
          </label>

          <div id="form-message" class="form-message" role="status" aria-live="polite" hidden></div>
          <button id="submit-button" class="button button-primary" type="submit">
            <span class="button-label">添加到自有源</span>
            <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M4 10h12M10 4l6 6-6 6" /></svg>
          </button>
          <p class="form-footnote">提交会创建一次 GitHub 提交；目录生成流程会自动读取包元数据。</p>
        </form>

        <section class="catalog-panel" aria-labelledby="catalog-title">
          <div class="section-heading catalog-heading">
            <div>
              <p class="eyebrow">CUSTOM CATALOG</p>
              <h2 id="catalog-title">已登记应用</h2>
            </div>
            <button id="refresh-button" class="icon-button" type="button" aria-label="刷新应用列表" title="刷新列表">
              <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M16.2 8A6.5 6.5 0 0 0 4.8 5.4L3.5 7M3.8 12a6.5 6.5 0 0 0 11.4 2.6l1.3-1.6M3.5 7h3.8M16.5 13h-3.8" /></svg>
            </button>
          </div>
          <div id="catalog-state" class="catalog-state" aria-live="polite">
            <span>应用列表尚未加载。请确认 Cloudflare Access 登录状态后刷新页面。</span>
          </div>
          <div id="app-list" class="app-list" hidden></div>
        </section>
      </section>

      <footer class="page-footer">
        <span>自动维护 · <code id="footer-path">config/ios/sources/custom/ipas.json</code></span>
        <a href="https://github.com/zhanghuid/ipa.sources" target="_blank" rel="noreferrer">打开仓库 <span aria-hidden="true">↗</span></a>
      </footer>
    </main>
  </body>
</html>
